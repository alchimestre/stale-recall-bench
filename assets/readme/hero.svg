<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">stale-recall-bench</title>
  <desc id="desc">A benchmark for coding-agent memory. It feeds memory systems notes that went stale and notes that are still true, then counts which ones the agent is shown at session start. Bars per memory system: flat shows 60 of 60 stale and 60 of 60 fresh, lore 56 stale and 58 fresh, mem0 47 stale and 53 fresh, supermemory 22 stale and 21 fresh, kage 10 stale and 4 fresh, truthiness 0 stale and 60 fresh.</desc>

  <rect width="1200" height="500" rx="24" fill="#0f1419"/>

  <g id="title-block" transform="translate(56 64)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b98a5" letter-spacing="1.5">CODING-AGENT MEMORY BENCHMARK</text>
    <text x="0" y="62" font-size="54" font-weight="700" fill="#e7ecf0">stale-recall-bench</text>
    <text x="0" y="110" font-size="24" fill="#c3ccd4">Feeds memory systems notes that went stale,</text>
    <text x="0" y="142" font-size="24" fill="#c3ccd4">then counts what the agent is shown.</text>

    <g id="note-pair" transform="translate(0 180)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="560" height="132" rx="12" fill="#161d24" stroke="#26313b"/>
      <text x="20" y="34" font-size="18" fill="#8b98a5">sphinx/domains/cpp.py · task sphinx-8548</text>
      <rect x="20" y="52" width="72" height="28" rx="6" fill="#f0883e" fill-opacity="0.18"/>
      <text x="56" y="72" font-size="18" fill="#f0a060" text-anchor="middle">stale</text>
      <text x="108" y="72" font-size="20" fill="#e7ecf0">def eof(self):</text>
      <rect x="20" y="90" width="72" height="28" rx="6" fill="#3fb950" fill-opacity="0.18"/>
      <text x="56" y="110" font-size="18" fill="#56d364" text-anchor="middle">fresh</text>
      <text x="108" y="110" font-size="20" fill="#e7ecf0">class ASTIdentifier(ASTBase):</text>
    </g>
  </g>

  <g id="exposure" transform="translate(672 64)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8b98a5" letter-spacing="1.5">SHOWN AT SESSION START</text>
    <g transform="translate(0 22)" font-size="18">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#f0883e"/>
      <text x="22" y="13" fill="#c3ccd4">stale of 60</text>
      <rect x="140" y="0" width="14" height="14" rx="3" fill="#3fb950"/>
      <text x="162" y="13" fill="#c3ccd4">fresh of 60</text>
    </g>

    <g id="rows" transform="translate(0 64)" font-size="20">
      <g transform="translate(0 0)">
        <text x="0" y="24" fill="#e7ecf0">flat</text>
        <rect x="140" y="4" width="300" height="16" rx="4" fill="#f0883e"/>
        <rect x="140" y="24" width="300" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">60</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">60</text>
      </g>
      <g transform="translate(0 58)">
        <text x="0" y="24" fill="#e7ecf0">lore</text>
        <rect x="140" y="4" width="280" height="16" rx="4" fill="#f0883e"/>
        <rect x="140" y="24" width="290" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">56</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">58</text>
      </g>
      <g transform="translate(0 116)">
        <text x="0" y="24" fill="#e7ecf0">mem0</text>
        <rect x="140" y="4" width="235" height="16" rx="4" fill="#f0883e"/>
        <rect x="140" y="24" width="265" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">47</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">53</text>
      </g>
      <g transform="translate(0 174)">
        <text x="0" y="24" fill="#e7ecf0">supermemory</text>
        <rect x="140" y="4" width="110" height="16" rx="4" fill="#f0883e"/>
        <rect x="140" y="24" width="105" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">22</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">21</text>
      </g>
      <g transform="translate(0 232)">
        <text x="0" y="24" fill="#e7ecf0">kage</text>
        <rect x="140" y="4" width="50" height="16" rx="4" fill="#f0883e"/>
        <rect x="140" y="24" width="20" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">10</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">4</text>
      </g>
      <g transform="translate(0 290)">
        <text x="0" y="24" fill="#e7ecf0">truthiness</text>
        <rect x="140" y="4" width="2" height="16" fill="#f0883e"/>
        <rect x="140" y="24" width="300" height="16" rx="4" fill="#3fb950"/>
        <text x="452" y="20" font-size="18" fill="#c3ccd4">0</text>
        <text x="452" y="40" font-size="18" fill="#c3ccd4">60</text>
      </g>
    </g>
  </g>
</svg>
